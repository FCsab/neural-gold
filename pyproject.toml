[project]
name = "gold-neural"
version = "0.1.0"
description = "PAXG/USDT neural trading system — Phase 1 data layer"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gold-neural = "gold_neural.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gold_neural*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
