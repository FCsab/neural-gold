[project]
name = "gold-neural"
version = "0.1.0"
description = "PAXG/USDT neural trading system — data layer + web workbench"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# PyTorch is not a base dependency: the wheel is large and the right build
# depends on the machine (CPU vs ROCm vs CUDA). Install one of:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install torch --index-url https://download.pytorch.org/whl/rocm6.4
train = ["torch>=2.4"]

[project.scripts]
gold-neural = "gold_neural.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gold_neural*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
